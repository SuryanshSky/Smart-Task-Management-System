{% extends "base.html" %}
{% block title %}Register — TaskFlow{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-brand">
        <div class="auth-logo">TF</div>
        <h1>TaskFlow</h1>
        <p>Your productivity, elevated.</p>
    </div>
    <div class="auth-card">
        <h2>Create account</h2>
        <p class="auth-sub">Start managing tasks today</p>
        <form id="registerForm" class="auth-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" name="username" placeholder="johndoe" required minlength="3">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" name="password" placeholder="Min. 6 characters" required minlength="6">
            </div>
            <div id="registerError" class="form-error hidden"></div>
            <button type="submit" class="btn btn--primary btn--full" id="registerBtn">
                <span>Create Account</span>
            </button>
        </form>
        <p class="auth-footer">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
    </div>
</div>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('registerBtn');
    const err = document.getElementById('registerError');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';
    err.classList.add('hidden');
    const res = await fetch('/auth/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            username: document.getElementById('username').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
        })
    });
    const data = await res.json();
    if (data.success) {
        window.location.href = '/auth/login';
    } else {
        const msgs = data.errors ? Object.values(data.errors).join(' ') : data.message;
        err.textContent = msgs;
        err.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<span>Create Account</span>';
    }
});
</script>
{% endblock %}
